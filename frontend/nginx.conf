server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend's own health endpoint for Kubernetes probes
    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # Forward API calls to the backend Service in the same namespace
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
